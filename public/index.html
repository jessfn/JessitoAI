<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jessito">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Jessito</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 45%,#12295a,#070c1f 60%,#03050f);font-family:system-ui,sans-serif;color:#cfe6ff;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;padding:0 16px}
#status{min-height:26px;margin-bottom:10px;font-size:18px;opacity:.85;text-shadow:0 0 12px #3a8dff}
button{font:inherit;border:0;border-radius:999px;padding:14px 30px;background:linear-gradient(#58a6ff,#2f7be8);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 0 28px #3a8dff88,0 6px 0 #1f5fc0}
button:active{transform:translateY(4px);box-shadow:0 0 28px #3a8dff88,0 2px 0 #1f5fc0}
@media (max-width:600px){#status{font-size:16px}button{padding:13px 28px}}
@media (max-height:420px){#status{display:none}}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
video{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#vbtn,#vpanel{display:none!important}
#vbtn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;padding:8px 18px;font-size:15px;background:#ffffff22;box-shadow:none;z-index:5}
#vpanel{position:fixed;inset:0;background:#030814f0;z-index:10;overflow:auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom));display:none}
#vpanel.open{display:block}
#vpanel .box{max-width:560px;margin:0 auto}
#vpanel h2{margin:0 0 4px;font-size:22px}#vpanel h3{margin:18px 0 8px;font-size:14px;color:#8aa6d6;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
#vpanel p{margin:0 0 6px;color:#8aa6d6;font-size:14px}
.small{padding:7px 15px;font-size:14px;box-shadow:none;background:#2f6fd0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 16px;font-size:15px;background:#12244f;box-shadow:none;border:1px solid #1f3470}
.chip.sel{background:#2f86ff;border-color:#7fd4ff}
.vitem{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #1f3470;border-radius:12px;margin:6px 0;background:#0b1530;text-align:left}
.vitem.sel{border-color:#3a8dff;box-shadow:0 0 14px #3a8dff66}.vitem b{display:block;font-size:15px}.vitem span{font-size:12px;color:#8aa6d6}
.vitem div:last-child{display:flex;gap:6px}
#vpanel label{display:block;margin:10px 0 2px;font-size:14px}#vpanel input[type=range]{width:100%}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<button id="vbtn">Voz</button>
<div id="vpanel"><div class="box">
  <h2>Elige mi voz</h2><p>Toca una opción para escucharla y quedarte con la que más te guste.</p>
  <h3>Estilos</h3><div class="chips" id="presets"></div>
  <h3>Ajustes</h3>
  <label>Velocidad <span id="rv"></span></label><input type="range" id="rate" min="70" max="150" step="2">
  <label>Tono <span id="pv"></span></label><input type="range" id="pitch" min="70" max="150" step="2">
  <h3>Voces de este dispositivo</h3><div id="voices"></div><p id="vhint"></p>
  <div style="margin-top:18px;display:flex;gap:8px"><button class="small" id="vtest">Escuchar ahora</button><button class="small" id="vclose" style="background:#1b2c5e">Listo</button></div>
</div></div>
<div id="ui"><div id="status">Toca el botón para hablar conmigo</div><button id="talk">Hablar</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="brain.js"></script>
<script src="gen.js"></script>
<script src="vision.js"></script>
<script>
const $=id=>document.getElementById(id);
const status=$('status'),cam=$('cam');
const T=THREE;

// ================= Renderer =================
const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(32,1,.1,60);
function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight;camera.aspect=a;
  camera.position.set(0,0,Math.max(6.6,3.7/(2*Math.tan(16*Math.PI/180)*a)));camera.lookAt(0,-.2,0);camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// ================= Utilidades de textura =================
function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
  const t=new T.CanvasTexture(c);if(srgb)t.encoding=T.sRGBEncoding;t.anisotropy=8;return t;
}
function speckle(x,w,h,n,a,light=255,dark=0){
  for(let i=0;i<n;i++){const v=Math.random()<.5?light:dark;x.fillStyle=`rgba(${v},${v},${v},${Math.random()*a})`;
    x.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*1.5,1+Math.random()*1.5)}
}
function scratches(x,w,h,n,col){
  x.lineWidth=1;for(let i=0;i<n;i++){x.strokeStyle=col.replace('A',(Math.random()*.35).toFixed(2));
    const px=Math.random()*w,py=Math.random()*h,a=Math.random()*Math.PI,l=6+Math.random()*28;
    x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}
}
// pintura azul del cuerpo: degradado, salpicado, rayones, paneles y calcomanía
const paintMap=canvasTex(1024,512,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#5fb0ff');g.addColorStop(.5,'#2d7ff0');g.addColorStop(1,'#1c56c2');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  speckle(x,w,h,3000,.07,255,0);scratches(x,w,h,160,'rgba(210,235,255,A)');scratches(x,w,h,60,'rgba(10,30,90,A)');
  x.strokeStyle='rgba(8,25,80,.55)';x.lineWidth=3;
  for(const u of[0,.5,1]){x.beginPath();x.moveTo(u*w,0);x.lineTo(u*w,h);x.stroke()}
  x.beginPath();x.moveTo(0,h*.2);x.lineTo(w,h*.2);x.stroke();
  // estrella calcomanía en la frente (u=.25 es el frente)
  x.save();x.translate(w*.25,h*.13);x.fillStyle='#ffe08a';x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();
  for(let i=0;i<10;i++){const r=i%2?7:16,a=-Math.PI/2+i*Math.PI/5;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
  x.closePath();x.fill();x.stroke();x.restore();
});
const paintBump=canvasTex(1024,512,(x,w,h)=>{
  x.fillStyle='#808080';x.fillRect(0,0,w,h);speckle(x,w,h,24000,.12);scratches(x,w,h,200,'rgba(255,255,255,A)');
  x.strokeStyle='#202020';x.lineWidth=5;for(const u of[0,.5,1]){x.beginPath();x.moveTo(u*w,0);x.lineTo(u*w,h);x.stroke()}
  x.beginPath();x.moveTo(0,h*.2);x.lineTo(w,h*.2);x.stroke();
},false);
const roughMap=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#999';x.fillRect(0,0,w,h);speckle(x,w,h,6000,.6,255,60)},false);

const screenTex=canvasTex(512,256,(x,w,h)=>{
  const g=x.createRadialGradient(w/2,h/2,10,w/2,h/2,w*.6);g.addColorStop(0,'#10285a');g.addColorStop(1,'#030816');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(120,190,255,.07)';for(let y=0;y<h;y+=4)x.fillRect(0,y,w,1.5);
  x.fillStyle='rgba(120,190,255,.05)';for(let i=0;i<w;i+=4)x.fillRect(i,0,1,h);
  const gl=x.createLinearGradient(0,0,w,h);gl.addColorStop(0,'rgba(255,255,255,.16)');gl.addColorStop(.35,'rgba(255,255,255,0)');
  x.fillStyle=gl;x.fillRect(0,0,w,h);
});
const brushed=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#2a3a5c';x.fillRect(0,0,w,h);
  for(let i=0;i<2500;i++){x.fillStyle=`rgba(${150+Math.random()*100|0},${170+Math.random()*80|0},255,${Math.random()*.12})`;x.fillRect(0,Math.random()*h,w,1)}});
const eyeballTex=canvasTex(1024,512,(x,w,h)=>{
  x.fillStyle='#f1f7ff';x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(120,150,210,.25)';x.lineWidth=1;for(let i=0;i<60;i++){x.beginPath();const px=Math.random()*w,py=Math.random()*h;x.moveTo(px,py);x.quadraticCurveTo(px+20,py+10*Math.random(),px+40*Math.random(),py+20)}x.stroke();
  const cx=w*.25,cy=h*.5,R=118;
  let g=x.createRadialGradient(cx,cy,R*.3,cx,cy,R*1.05);g.addColorStop(0,'#0a2f7a');g.addColorStop(.35,'#2a86e8');g.addColorStop(.8,'#6fd0ff');g.addColorStop(.93,'#0b2f6e');g.addColorStop(1,'rgba(10,40,100,0)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*1.05,0,7);x.fill();
  for(let i=0;i<150;i++){const a=Math.random()*6.283,r1=R*.28,r2=R*(.7+Math.random()*.25);
    x.strokeStyle=Math.random()<.5?'rgba(220,245,255,.45)':'rgba(5,35,110,.5)';x.lineWidth=1+Math.random()*1.5;
    x.beginPath();x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.lineTo(cx+Math.cos(a+.05)*r2,cy+Math.sin(a+.05)*r2);x.stroke()}
  x.strokeStyle='#061a45';x.lineWidth=7;x.beginPath();x.arc(cx,cy,R*.97,0,7);x.stroke();
});
const softTex=(r,g,b)=>canvasTex(128,128,(x,w,h)=>{const q=x.createRadialGradient(64,64,0,64,64,64);
  q.addColorStop(0,`rgba(${r},${g},${b},1)`);q.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=q;x.fillRect(0,0,w,h)});
function glow(color,size,op=.7){const s=new T.Sprite(new T.SpriteMaterial({map:softTex(...color),transparent:true,opacity:op,blending:T.AdditiveBlending,depthWrite:false}));s.scale.set(size,size,1);return s}

// ================= Reflejos del entorno (softboxes procedurales) =================
(function(){
  const env=new T.Scene();
  const sky=new T.Mesh(new T.SphereGeometry(20,32,16),new T.MeshBasicMaterial({side:T.BackSide,map:canvasTex(8,256,(x,w,h)=>{
    const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#5d8dff');g.addColorStop(.5,'#16306a');g.addColorStop(1,'#050a1c');x.fillStyle=g;x.fillRect(0,0,w,h)})}));env.add(sky);
  const box=(w,h,c,p)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:c,side:T.DoubleSide}));m.position.set(...p);m.lookAt(0,0,0);env.add(m)};
  box(10,6,0xffffff,[6,8,8]);box(4,10,0x9cd0ff,[-9,2,4]);box(8,2,0xffffff,[0,12,-3]);box(5,5,0x3a8dff,[-4,-2,-10]);
  const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(env,.03).texture;
})();

// ================= Luces =================
scene.add(new T.AmbientLight(0x4a68b0,.35));
const key=new T.DirectionalLight(0xffffff,1.6);key.position.set(4,7,6);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:25});key.shadow.bias=-.0004;key.shadow.radius=4;scene.add(key);
const rim=new T.PointLight(0x3a8dff,3.5,25);rim.position.set(-5,2,-3);scene.add(rim);
const rim2=new T.PointLight(0x7fd4ff,2,25);rim2.position.set(5,0,-4);scene.add(rim2);
const fill=new T.PointLight(0x66ccff,1.2,20);fill.position.set(0,-2,6);scene.add(fill);

// ================= Materiales =================
const paint=new T.MeshPhysicalMaterial({map:paintMap,bumpMap:paintBump,bumpScale:.25,roughnessMap:roughMap,roughness:.5,metalness:.1,clearcoat:1,clearcoatRoughness:.12,envMapIntensity:1.2});
const paintDeep=new T.MeshPhysicalMaterial({color:0x1d5fd0,roughness:.35,metalness:.15,clearcoat:.8,clearcoatRoughness:.15});
const metal=new T.MeshStandardMaterial({map:brushed,color:0xaab8d8,roughness:.32,metalness:.9});
const darkRubber=new T.MeshStandardMaterial({color:0x0e1730,roughness:.75,metalness:.1});
const white=new T.MeshPhysicalMaterial({color:0xeaf4ff,roughness:.35,clearcoat:.6});
const glass=new T.MeshPhysicalMaterial({map:screenTex,color:0xffffff,roughness:.06,metalness:.2,clearcoat:1,clearcoatRoughness:.02,envMapIntensity:.9});
const neon=c=>new T.MeshBasicMaterial({color:c});

// ================= Robot =================
const root=new T.Group();scene.add(root);root.position.y=0;
const head=new T.Group();root.add(head);
const mesh=(geo,mat,p=[0,0,0],s=[1,1,1],par)=>{const m=new T.Mesh(geo,mat);m.position.set(...p);m.scale.set(...s);(par||head).add(m);return m};
const sph=(r,w=48,h=32)=>new T.SphereGeometry(r,w,h);
function ring(r,tube,mat,p,sc,par,rot){const m=mesh(new T.TorusGeometry(r,tube,16,64),mat,p,sc,par);if(rot)m.rotation.set(...rot);return m}
function capsule(r,len,mat,par){const g=new T.Group();
  const c=new T.Mesh(new T.CylinderGeometry(r,r,len,24),mat);c.position.y=-len/2;g.add(c);
  const a=new T.Mesh(sph(r,24,16),mat);g.add(a);const b=new T.Mesh(sph(r,24,16),mat);b.position.y=-len;g.add(b);(par||root).add(g);return g}

// ---- Cabeza ----
mesh(sph(1,96,64),paint,[0,0,0],[1.25,1.1,1.1]);
// pantalla de cristal + marco
mesh(sph(1,64,48),glass,[0,.02,.62],[1,.78,.5]);
const bezel=ring(1,.075,metal,[0,.02,.6],[1.02,.8,.5]);
ring(1,.02,neon(0x5fc8ff),[0,.02,.66],[.96,.74,.5]); // filete luminoso interior
// línea de panel alrededor y tornillos
ring(1,.014,darkRubber,[0,0,.1],[1.25*.995,1.1*.995,1]).scale.set(1.25*.995,1.1*.995,1);
for(let i=0;i<8;i++){const a=i/8*Math.PI*2+.2,rx=1.25*.99,ry=1.1*.99,x=Math.cos(a)*rx,y=Math.sin(a)*ry;
  const scr=mesh(new T.CylinderGeometry(.045,.045,.03,16),metal,[x,y,.12]);scr.rotation.x=Math.PI/2;
  const slot=mesh(new T.BoxGeometry(.06,.01,.005),darkRubber,[x,y,.14]);slot.rotation.z=a}
// "ventilas" laterales superiores
for(let i=0;i<3;i++)for(const s of[-1,1])mesh(new T.BoxGeometry(.2,.018,.02),darkRubber,[s*.5,.93-i*.05+.0,.78-i*.05]).rotation.x=-.7;
// orejas: copa metálica, anillo luminoso, almohadilla
const earGlows=[];
for(const s of[-1,1]){
  const g=new T.Group();g.position.set(s*1.22,0,0);head.add(g);
  const cup=mesh(new T.CylinderGeometry(.34,.38,.34,48),paintDeep,[s*.12,0,0],[1,1,1],g);cup.rotation.z=Math.PI/2;
  const cap=mesh(new T.CylinderGeometry(.27,.27,.06,48),metal,[s*.3,0,0],[1,1,1],g);cap.rotation.z=Math.PI/2;
  const gr=mesh(new T.TorusGeometry(.2,.02,12,48),neon(0x7fd4ff),[s*.34,0,0],[1,1,1],g);gr.rotation.y=Math.PI/2;earGlows.push(gr);
  mesh(new T.CylinderGeometry(.1,.1,.04,24),white,[s*.345,0,0],[1,1,1],g).rotation.z=Math.PI/2;
  mesh(sph(.12,24,16),darkRubber,[s*-.05,0,0],[1,1,1],g);
}
// antena: base, resorte, tallo, bulbo con halo
mesh(new T.CylinderGeometry(.2,.28,.1,32),metal,[0,1.08,0]);
const coilPts=[];for(let i=0;i<=60;i++){const a=i/60*Math.PI*2*5;coilPts.push(new T.Vector3(Math.cos(a)*.07,1.13+i/60*.3,Math.sin(a)*.07))}
mesh(new T.TubeGeometry(new T.CatmullRomCurve3(coilPts),200,.015,8),metal);
const antTip=new T.Group();antTip.position.set(0,1.43,0);head.add(antTip);
mesh(new T.CylinderGeometry(.03,.03,.2,12),metal,[0,.1,0],[1,1,1],antTip);
const bulb=mesh(sph(.13,32,24),neon(0xffe08a),[0,.3,0],[1,1,1],antTip);
const halo=glow([255,214,120],.9,.8);halo.position.set(0,.3,0);antTip.add(halo);
// ojos con iris texturizado, brillos y resplandor
function rrGeo(w,h,r){const s=new T.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  const g=new T.ShapeGeometry(s,10),p=g.attributes.position,uv=g.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,p.getX(i)/w+.5,p.getY(i)/h+.5);return g}
const eyeRigs=[];const ER=.22;
for(const sd of[-1,1]){
  const g=new T.Group();g.position.set(sd*.42,.22,.95);head.add(g);
  const hl=glow([90,200,255],1.1,.3);hl.position.z=.1;g.add(hl);
  const ball=new T.Mesh(sph(ER,64,48),new T.MeshPhysicalMaterial({map:eyeballTex,roughness:.25,clearcoat:1,clearcoatRoughness:.03,envMapIntensity:1.4}));g.add(ball);
  const pupil=new T.Mesh(new T.CircleGeometry(ER*.27,32),new T.MeshBasicMaterial({color:0x010510,polygonOffset:true,polygonOffsetFactor:-2}));pupil.position.z=ER*.985;ball.add(pupil);
  const cornea=new T.Mesh(sph(ER*1.025,48,32),new T.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.13,roughness:0,metalness:0,clearcoat:1,clearcoatRoughness:0,envMapIntensity:2.5,depthWrite:false}));g.add(cornea);
  const sp1=new T.Mesh(new T.CircleGeometry(ER*.17,24),neon(0xffffff));sp1.position.set(-ER*.38,ER*.42,ER*1.04);g.add(sp1);
  const sp2=new T.Mesh(new T.CircleGeometry(ER*.08,16),neon(0xffffff));sp2.position.set(ER*.4,-ER*.35,ER*1.04);g.add(sp2);
  const lidM=new T.MeshPhysicalMaterial({color:0x2a78e6,roughness:.3,clearcoat:.8,side:T.DoubleSide});
  const up=new T.Mesh(new T.SphereGeometry(ER*1.1,40,20,0,Math.PI*2,0,Math.PI/2),lidM);g.add(up);
  const lo=new T.Mesh(new T.SphereGeometry(ER*1.09,40,20,0,Math.PI*2,Math.PI/2,Math.PI/2),lidM);g.add(lo);
  const rimT=new T.Mesh(new T.TorusGeometry(ER*1.12,.028,12,40),darkRubber);rimT.position.z=-.05;g.add(rimT);
  eyeRigs.push({g,ball,pupil,up,lo,sd});
}
// cejas
const brows=[],browMat=new T.MeshBasicMaterial({color:0x7fd4ff});
function capsule3(len,r,mat){const g=new T.Group(),c=new T.Mesh(new T.CylinderGeometry(r,r,len,12),mat);c.rotation.z=Math.PI/2;g.add(c);for(const k of[-1,1]){const b=new T.Mesh(sph(r,12,8),mat);b.position.x=k*len/2;g.add(b)}return g}
eyeRigs.forEach(r=>{const arc=new T.Mesh(new T.TorusGeometry(ER*.8,.03,8,28,Math.PI),browMat);arc.rotation.z=Math.PI;arc.position.set(0,.05,.13);arc.visible=false;r.g.add(arc);r.arc=arc});   // ojo cerrado: arco luminoso
for(const sd of[-1,1]){const g=new T.Group();g.position.set(sd*.43,.6,.915);g.rotation.set(-.7,0,0);g.add(capsule3(.3,.024,browMat));head.add(g);brows.push({g,s:sd,y:.6,rot:0})}
// mejillas (rubor suave)
const cheeks=[];
for(const s of[-1,1]){const c=new T.Mesh(new T.PlaneGeometry(.38,.24),new T.MeshBasicMaterial({map:softTex(255,120,170),transparent:true,opacity:.75,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
  c.position.set(s*.64,-.12,1.0);c.rotation.y=s*.55;head.add(c);cheeks.push(c)}
// boca: matriz de luces LED en una placa rectangular
const mouthG=new T.Group();mouthG.position.set(0,-.3,1.13);mouthG.rotation.x=.3;head.add(mouthG);
mouthG.add(new T.Mesh(rrGeo(1.0,.5,.08),metal));

  const clean=text.replace(/[\p{Extended_Pictographic}️‍*_#~`]/gu,'').replace(/\bjessito\b/gi,'Yessito').replace(/\s+/g,' ').trim();

  try{
    const c=audioCtx();
    if(c&&c.state==='suspended')await Promise.race([c.resume().catch(()=>{}),sleep(400)]);
    if(c&&c.state==='running'&&Date.now()>ttsOffUntil&&parts.length){
      try{
        let cur=ttsGet(parts[0],emotion);cur.catch(()=>{});
        // si la primera frase tarda en generarse, una muletilla ya guardada ("Mmm.") evita el silencio

          if(cur)cur.catch(()=>{});

  const hasM=l.some(v=>gender(v)==='m');
  $('vhint').textContent=!l.length?'Este navegador no tiene voces en español.':hasM?'':'En este dispositivo solo hay voces femeninas o sin identificar. Abre Jessito en Microsoft Edge: ahí aparecen voces masculinas naturales como Jorge, Álvaro o Diego.';
  $('presets').innerHTML='';
  PRESETS.forEach(pz=>{const b=document.createElement('button');b.className='chip'+(VS.preset===pz.id?' sel':'');b.textContent=pz.name;
    b.onclick=()=>{Object.assign(VS,{rate:pz.rate,pitch:pz.pitch,male:pz.male,voice:'',preset:pz.id});VOICES=null;saveVS();syncSliders();renderVoices();speak('Hola, soy Yessito. ¿Así te gusta mi voz?','happy')};
    $('presets').appendChild(b)});
}
function syncSliders(){$('rate').value=Math.round(VS.rate*100);$('pitch').value=Math.round(VS.pitch*100);$('rv').textContent=Math.round(VS.rate*100)+'%';$('pv').textContent=Math.round(VS.pitch*100)+'%'}
$('rate').oninput=()=>{VS.rate=$('rate').value/100;VS.preset='';$('rv').textContent=$('rate').value+'%';saveVS()};
$('pitch').oninput=()=>{VS.pitch=$('pitch').value/100;VS.preset='';$('pv').textContent=$('pitch').value+'%';saveVS()};
$('vbtn').onclick=()=>{VOICES=null;syncSliders();renderVoices();$('vpanel').classList.add('open')};
$('vclose').onclick=()=>$('vpanel').classList.remove('open');
$('vtest').onclick=()=>speak('Hola, soy Yessito. Estoy listo para platicar contigo.','happy');
const sid=Math.random().toString(36).slice(2);
async function turn(text){
  const a=Brain.reply(text,{vision:Vision.summary()});
  if(a.action)applyAction(a.action);
  fetch('/api/log',{method:'POST',headers:{'content-type':'application/json'},keepalive:true,
    body:JSON.stringify({session:sid,user_text:text,intent:a.tag,confidence:a.conf,reply:a.text,emotion:a.emotion,vision:Vision.snapshot(),model_version:Brain.version+(a.gen?'+gen':'')})}).catch(()=>{});
  await speak(a.text,a.emotion);
}

// ---- escucha manos libres: Jessito te oye todo el tiempo, sin tocar nada ----
let wantListen=false,rec=null,busyTurn=false;
function setBtn(){$('talk').textContent=wantListen?'Pausar':'Escuchar'}
function stopListening(temp){
  if(!temp){wantListen=false;setBtn();try{localStorage.removeItem('blu_auto')}catch{}}
  if(rec){try{rec.onend=null;rec.onresult=null;rec.onerror=null;rec.abort()}catch{}rec=null}
}
function listenOnce(){
  if(!wantListen||talking||busyTurn||rec)return;
  const r=new SR();rec=r;r.lang='es-MX';r.interimResults=false;r.maxAlternatives=1;r.continuous=false;
  r.onstart=()=>{if(!busyTurn&&!talking){setEmotion('listening');status.textContent='Te escucho...'}};
  r.onresult=async e=>{const t=(e.results[0][0].transcript||'').trim();rec=null;if(t)await handle(t)};
  r.onerror=e=>{rec=null;if(e.error==='not-allowed'||e.error==='service-not-allowed'){wantListen=false;setBtn();status.textContent='Necesito permiso para usar el micrófono'}};
  r.onend=()=>{if(rec===r)rec=null;if(wantListen&&!talking&&!busyTurn)setTimeout(listenOnce,250)};
  try{r.start()}catch{rec=null;setTimeout(listenOnce,700)}
}
async function handle(t){
  busyTurn=true;status.textContent='';setEmotion('thinking');
  try{await turn(t)}catch(err){console.error(err);await speak('Se me enredó el cerebro, intenta otra vez.','sad')}
  await new Promise(r=>setTimeout(r,600));                       // se queda con la emoción un momento
  busyTurn=false;setEmotion(wantListen?'listening':'happy');status.textContent=wantListen?'Te escucho...':'';
  listenOnce();
}
async function startListening(fromUser){
  if(!SR){status.textContent='Usa Chrome o Edge para que pueda escucharte';return}
  wantListen=true;setBtn();try{localStorage.setItem('blu_auto','1')}catch{}
  if(fromUser){const n=Brain.memory.facts.name;busyTurn=true;await speak(`Hola${n?' '+n:''}, ya te escucho.`,'happy');busyTurn=false}
  setEmotion('listening');listenOnce();
}
$('talk').onclick=()=>{if(wantListen){stopListening(false);setEmotion('happy');status.textContent='Pausado. Toca Escuchar para seguir.'}else startListening(true)};
addEventListener('visibilitychange',()=>{if(!document.hidden&&wantListen)listenOnce()});
function autoStart(){                                           // si ya la usabas, vuelve a escuchar sola
  let auto=false;try{auto=localStorage.getItem('blu_auto')==='1'}catch{}
  if(!auto||!SR)return;
  if(navigator.userActivation&&!navigator.userActivation.hasBeenActive){
    status.textContent='Toca la pantalla para que empiece a escucharte';
    addEventListener('pointerdown',()=>startListening(false),{once:true});
  }else startListening(false);
}
// ================= Arranque =================
$('talk').disabled=true;$('talk').textContent='Escuchar';status.textContent='Despertando mi cerebro...';
Gen.load().catch(()=>{});
Brain.load().then(()=>{$('talk').disabled=false;status.textContent='Toca el botón y háblame, yo te escucho.';autoStart()})
  .catch(()=>{status.textContent='No pude cargar mi cerebro. Revisa tu internet.'});
Vision.start(cam);
setTimeout(warmVoices,8000);

// ================= PWA: instalación y actualización inmediata =================
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
let VER=null,pendingReload=false;
function reloadApp(){const r=navigator.serviceWorker&&navigator.serviceWorker.getRegistration();(r?r.then(x=>x&&x.update()):Promise.resolve()).catch(()=>{}).finally(()=>location.reload())}
async function checkVersion(v){
  if(!v){try{v=await fetch('/api/version',{cache:'no-store'}).then(r=>r.json())}catch{return}}
  if(!VER){VER=v;return}
  if(v.version===VER.version)return;
  const appChanged=v.app!==VER.app;VER=v;
  if(appChanged){if(busyTurn||talking)pendingReload=true;else reloadApp()}      // código nuevo: recarga
  else{Brain.load().catch(()=>{});Gen.load().catch(()=>{})}                                             // solo cerebro nuevo: se cambia en caliente
}
setInterval(()=>{if(pendingReload&&!busyTurn&&!talking)reloadApp()},1500);
try{const es=new EventSource('/api/events');es.addEventListener('version',e=>checkVersion(JSON.parse(e.data)))}catch{}
addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});
setInterval(checkVersion,60000);checkVersion();
</script>
